spring.application.name=produits-service
server.port=8091

# PostgreSQL (localhost for local dev, overridden by Docker env vars)
spring.datasource.url=jdbc:postgresql://localhost:5432/produitsdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CRITICAL: run data.sql AFTER Hibernate creates the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Redis Cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Swagger
springdoc.api-docs.path=/api-docs